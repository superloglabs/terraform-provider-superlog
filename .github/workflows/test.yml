name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Docs are up to date
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: |
          go generate ./...
          git diff --exit-code docs
